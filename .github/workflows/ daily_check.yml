name: Daily Stock Checker

on:
  schedule:
    # 平日（月〜金）の日本時間15:40（UTC 06:40）に自動実行
    - cron: '40 6 * * 1-5'
  workflow_dispatch:

jobs:
  run-checker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 必要なライブラリをインストール
        run: |
          pip install yfinance pandas pytz matplotlib

      - name: 相場流判定とチャート生成を実行
        run: |
          python check_signals.py

      - name: 生成データと全チャート画像をGitHubに保存
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add result.json chart*.png
          if git diff --staged --quiet; then
            echo "変更はありませんでした。"
          else
            git commit -m "Update stock results and charts [skip ci]"
            git push
          fi
