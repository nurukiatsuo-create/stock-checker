<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>【相場流】シグナル判定 Web版</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0d0e12; color: #ffffff; padding: 12px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 960px; background: #15161c; border-radius: 12px; padding: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    
    /* ヘッダー */
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #232530; padding-bottom: 12px; margin-bottom: 14px; }
    .header h1 { font-size: 16px; font-weight: bold; }
    .header-right { display: flex; align-items: center; gap: 10px; font-size: 12px; color: #8e8e93; }
    .btn-refresh { background: #232530; border: 1px solid #3a3d4d; color: #fff; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
    .btn-refresh:hover { background: #2e3140; }

    /* メイングリッド */
    .main-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
    @media (max-width: 768px) { .main-grid { grid-template-columns: 1fr; } }

    /* 左カラム：チャートエリア */
    .chart-panel { background: #1a1b22; border-radius: 8px; padding: 14px; border: 1px solid #232530; }
    .stock-title-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .stock-title { font-size: 18px; font-weight: bold; color: #ffffff; }
    .chart-badges { display: flex; gap: 6px; }
    .badge { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .badge-gray { background: #2c2d38; color: #8e8e93; }
    .badge-red { background: #ff453a; color: #fff; }
    .badge-blue { background: #0a84ff; color: #fff; }
    .badge-purple { background: #af52de; color: #fff; }
    .badge-green { background: #30d158; color: #fff; }

    .chart-sub { font-size: 11px; color: #8e8e93; text-align: center; margin-bottom: 6px; }
    canvas { width: 100%; height: 260px; display: block; }

    /* 右カラム：ポートフォリオ一覧 */
    .list-panel { background: #1a1b22; border-radius: 8px; padding: 14px; border: 1px solid #232530; }
    .list-title { font-size: 14px; font-weight: bold; color: #fff; margin-bottom: 12px; }
    
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { color: #8e8e93; font-weight: normal; text-align: right; padding: 6px 4px; font-size: 11px; }
    th:first-child { text-align: left; }
    th:nth-child(3), th:nth-child(4) { text-align: center; }

    tr { border-bottom: 1px solid #232530; cursor: pointer; transition: 0.15s; }
    tr:hover { background: #232532; }
    tr.active { background: #282a3a; }
    td { padding: 10px 4px; text-align: right; }
    td:first-child { text-align: left; font-weight: bold; }
    td:nth-child(3), td:nth-child(4) { text-align: center; }

    .code-text { font-size: 11px; color: #8e8e93; margin-left: 4px; font-weight: normal; }
    .active-mark { color: #ffd60a; margin-right: 4px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>【相場流】シグナル判定</h1>
    <div class="header-right">
      <span id="update-time">--/-- --:-- JST</span>
      <button class="btn-refresh" onclick="loadAllData()">↻ 更新</button>
    </div>
  </div>

  <div class="main-grid">
    <!-- チャート -->
    <div class="chart-panel">
      <div class="stock-title-bar">
        <div class="stock-title" id="selected-title">三菱UFJ (8306)</div>
        <div class="chart-badges">
          <span class="badge badge-gray" id="selected-gen">待機</span>
          <span class="badge badge-gray" id="selected-shin">待機</span>
        </div>
      </div>
      <div class="chart-sub" id="chart-sub-code">STOCK CODE: 8306 (5MA / 20MA)</div>
      <canvas id="stockChart"></canvas>
    </div>

    <!-- 銘柄リスト -->
    <div class="list-panel">
      <div class="list-title">監視ポートフォリオ（タップで切替）</div>
      <table>
        <thead>
          <tr>
            <th>銘柄</th>
            <th>株価 / 損益</th>
            <th>現物</th>
            <th>信用</th>
          </tr>
        </thead>
        <tbody id="stock-tbody">
          <!-- JSで自動生成 -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
// ==========================================
// 1. エリート6銘柄 定義
// ==========================================
const UNIVERSE = [
  { code: "8306.T", num: "8306", name: "三菱UFJ", target: 300 },
  { code: "7182.T", num: "7182", name: "ゆうちょ銀行", target: 500 },
  { code: "8393.T", num: "8393", name: "宮崎銀行", target: 200 },
  { code: "8058.T", num: "8058", name: "三菱商事", target: 300 },
  { code: "6981.T", num: "6981", name: "村田製作所", target: 300 },
  { code: "4502.T", num: "4502", name: "武田薬品", target: 200 }
];

let selectedIndex = 0;
let stockDataStore = {};

// ==========================================
// 2. Yahoo Finance データ取得 (CORSプロキシ経由)
// ==========================================
async function fetchStock(symbol) {
  const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?range=3mo&interval=1d`;
  const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
  try {
    const res = await fetch(proxyUrl);
    const json = await res.json();
    const result = json.chart.result[0];
    const ts = result.timestamp;
    const q = result.indicators.quote[0];

    let bars = [];
    for (let i = 0; i < ts.length; i++) {
      if (q.close[i] !== null && q.open[i] !== null) {
        bars.push({
          date: new Date(ts[i] * 1000),
          open: q.open[i],
          high: q.high[i],
          low: q.low[i],
          close: q.close[i]
        });
      }
    }
    return bars;
  } catch (e) {
    return null;
  }
}

function calcMA(bars, period) {
  return bars.map((b, i) => {
    if (i < period - 1) return null;
    let sum = 0;
    for (let j = 0; j < period; j++) sum += bars[i - j].close;
    return sum / period;
  });
}

// 相場流判定
function evaluateAiba(bars, ma5, ma20) {
  const i = bars.length - 1;
  const curr = bars[i], prev = bars[i - 1];
  const c_open = curr.open, c_close = curr.close;
  const c_high = curr.high, c_low = curr.low;
  const p_close = prev.close;
  const m5 = ma5[i], m20 = ma20[i];
  const p_m5 = ma5[i - 1], p_m20 = ma20[i - 1];

  if (!m5 || !m20 || !p_m5 || !p_m20) return { signal: null, score: 0 };

  const isYang = c_close >= c_open;
  const isYin = c_close < c_open;
  const mid = (c_open + c_close) / 2.0;

  const isShita = isYang && (mid > m5) && (c_close > m5) && (p_close <= p_m5) && (m5 >= p_m5);
  const isGyaku = isYin && (mid < m5) && (c_close < m5) && (p_close >= p_m5) && (m5 <= p_m5);
  const isMono = (c_low <= m20 * 1.015) && (c_close > m20) && isYang && (m20 >= p_m20);

  let signal = null;
  let score = 0;
  if (isShita && (m20 >= p_m20) && (c_close >= m20)) {
    signal = "BUY";
    score = isMono ? 80 : 50;
  } else if (isGyaku && (m20 <= p_m20) && (c_close <= m20)) {
    signal = "SHORT";
    score = 50;
  }
  return { signal, score };
}

// ==========================================
// 3. 全銘柄ロード & テーブル描画
// ==========================================
async function loadAllData() {
  const now = new Date();
  document.getElementById("update-time").textContent = 
    `${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ` +
    `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')} JST`;

  const tbody = document.getElementById("stock-tbody");
  tbody.innerHTML = "<tr><td colspan='4' style='text-align:center; color:#8e8e93; padding:20px;'>データ更新中...</td></tr>";

  stockDataStore = {};
  for (let i = 0; i < UNIVERSE.length; i++) {
    const item = UNIVERSE[i];
    const bars = await fetchStock(item.code);
    if (bars && bars.length > 25) {
      const ma5 = calcMA(bars, 5);
      const ma20 = calcMA(bars, 20);
      const res = evaluateAiba(bars, ma5, ma20);
      stockDataStore[item.code] = {
        bars, ma5, ma20,
        price: bars[bars.length - 1].close,
        signal: res.signal,
        score: res.score
      };
    }
  }

  renderTable();
  selectStock(selectedIndex);
}

function renderTable() {
  const tbody = document.getElementById("stock-tbody");
  tbody.innerHTML = "";

  UNIVERSE.forEach((item, idx) => {
    const data = stockDataStore[item.code];
    const tr = document.createElement("tr");
    if (idx === selectedIndex) tr.className = "active";
    tr.onclick = () => selectStock(idx);

    const priceStr = data ? Math.floor(data.price).toLocaleString() : "--";
    const isActive = (idx === selectedIndex);

    let genBadge = `<span class="badge badge-gray">待機</span>`;
    let shinBadge = `<span class="badge badge-gray">待機</span>`;

    if (data && data.signal === "BUY") {
      genBadge = `<span class="badge badge-red">現買</span>`;
    } else if (data && data.signal === "SHORT") {
      shinBadge = `<span class="badge badge-blue">空売</span>`;
    }

    tr.innerHTML = `
      <td>${isActive ? '<span class="active-mark">▶</span>' : ''}${item.name} <span class="code-text">${item.num}</span></td>
      <td>${priceStr}</td>
      <td>${genBadge}</td>
      <td>${shinBadge}</td>
    `;
    tbody.appendChild(tr);
  });
}

function selectStock(idx) {
  selectedIndex = idx;
  const item = UNIVERSE[idx];
  const data = stockDataStore[item.code];

  document.getElementById("selected-title").textContent = `${item.name} (${item.num})`;
  document.getElementById("chart-sub-code").textContent = `STOCK CODE: ${item.num} (5MA / 20MA)`;

  const genEl = document.getElementById("selected-gen");
  const shinEl = document.getElementById("selected-shin");

  if (data && data.signal === "BUY") {
    genEl.textContent = "現買";
    genEl.className = "badge badge-red";
  } else {
    genEl.textContent = "待機";
    genEl.className = "badge badge-gray";
  }

  if (data && data.signal === "SHORT") {
    shinEl.textContent = "空売";
    shinEl.className = "badge badge-blue";
  } else {
    shinEl.textContent = "待機";
    shinEl.className = "badge badge-gray";
  }

  renderTable();
  if (data && data.bars) {
    drawCanvasChart(data.bars, data.ma5, data.ma20);
  }
}

// ==========================================
// 4. チャート描画 (Canvas)
// ==========================================
function drawCanvasChart(bars, ma5, ma20) {
  const canvas = document.getElementById("stockChart");
  const ctx = canvas.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();

  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);

  const w = rect.width;
  const h = rect.height;
  const count = 35;
  const sBars = bars.slice(-count);
  const sMA5 = ma5.slice(-count);
  const sMA20 = ma20.slice(-count);

  let minP = Infinity, maxP = -Infinity;
  sBars.forEach(b => {
    if (b.low < minP) minP = b.low;
    if (b.high > maxP) maxP = b.high;
  });
  sMA20.forEach(v => { if (v && v < minP) minP = v; if (v && v > maxP) maxP = v; });

  const padY = (maxP - minP) * 0.08;
  minP -= padY; maxP += padY;
  const pRange = maxP - minP;

  const leftPad = 40;
  const chartW = w - leftPad;
  const getY = (p) => h - 20 - ((p - minP) / pRange) * (h - 30);
  const stepX = chartW / count;

  // グリッド線
  ctx.strokeStyle = "rgba(255,255,255,0.08)";
  ctx.fillStyle = "#8e8e93";
  ctx.font = "10px sans-serif";
  ctx.lineWidth = 1;
  for (let g = 0; g <= 3; g++) {
    const p = minP + (pRange / 3) * g;
    const y = getY(p);
    ctx.beginPath();
    ctx.moveTo(leftPad, y);
    ctx.lineTo(w, y);
    ctx.stroke();
    ctx.fillText(Math.round(p), 4, y + 3);
  }

  // ローソク足
  sBars.forEach((b, i) => {
    const x = leftPad + i * stepX + stepX / 2;
    const isYang = b.close >= b.open;
    const color = isYang ? "#ff453a" : "#0a84ff";

    ctx.strokeStyle = color;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(x, getY(b.high));
    ctx.lineTo(x, getY(b.low));
    ctx.stroke();

    const top = getY(Math.max(b.open, b.close));
    const bot = getY(Math.min(b.open, b.close));
    ctx.fillStyle = color;
    ctx.fillRect(x - stepX * 0.35, top, Math.max(stepX * 0.7, 1), Math.max(bot - top, 2));
  });

  // 20MA (青)
  ctx.strokeStyle = "#0a84ff";
  ctx.lineWidth = 2.0;
  ctx.beginPath();
  let started20 = false;
  sMA20.forEach((val, i) => {
    if (val) {
      const x = leftPad + i * stepX + stepX / 2;
      const y = getY(val);
      if (!started20) { ctx.moveTo(x, y); started20 = true; }
      else ctx.lineTo(x, y);
    }
  });
  ctx.stroke();

  // 5MA (赤)
  ctx.strokeStyle = "#ff453a";
  ctx.lineWidth = 2.0;
  ctx.beginPath();
  let started5 = false;
  sMA5.forEach((val, i) => {
    if (val) {
      const x = leftPad + i * stepX + stepX / 2;
      const y = getY(val);
      if (!started5) { ctx.moveTo(x, y); started5 = true; }
      else ctx.lineTo(x, y);
    }
  });
  ctx.stroke();
}

// 初回ロード
window.onload = loadAllData;
</script>
</body>
</html>
