<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>【相場流】新8銘柄 監視ダッシュボード</title>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1c1c1e;
      --border-color: #2c2c2e;
      --text-main: #f2f2f7;
      --text-sub: #8e8e93;
      --accent-yellow: #ffd60a;
      --buy-red: #ff453a;
      --short-blue: #0a84ff;
      --ma5-red: #ff3b30;
      --ma20-blue: #0a84ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container { width: 100%; max-width: 860px; display: flex; flex-direction: column; gap: 16px; }
    header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
    h1 { font-size: 1.25rem; font-weight: 700; }
    .status-text { font-size: 0.8rem; color: var(--text-sub); }
    .card { background-color: var(--card-bg); border-radius: 12px; padding: 16px; border: 1px solid var(--border-color); }
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.95rem; }
    th { color: var(--text-sub); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--border-color); white-space: nowrap; }
    td { padding: 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); white-space: nowrap; }
    tr.clickable-row { cursor: pointer; transition: background 0.15s; }
    tr.clickable-row:hover { background-color: rgba(255, 255, 255, 0.05); }
    tr.selected-row { background-color: rgba(255, 214, 10, 0.12); }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: 700; text-align: center; }
    .badge-wait { background-color: #2c2c2e; color: #aeaeb2; }
    .badge-buy { background-color: var(--buy-red); color: #fff; }
    .badge-short { background-color: var(--short-blue); color: #fff; }
    .score-high { color: var(--buy-red); font-weight: 700; }
    .score-mid { color: var(--accent-yellow); font-weight: 600; }
    .score-none { color: var(--text-sub); }
    .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .chart-title { font-size: 1.05rem; font-weight: 700; color: var(--accent-yellow); }
    .legend { display: flex; gap: 12px; font-size: 0.75rem; }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .dot-ma5 { width: 10px; height: 10px; background: var(--ma5-red); border-radius: 2px; }
    .dot-ma20 { width: 10px; height: 10px; background: var(--ma20-blue); border-radius: 2px; }
    #chartCanvas { width: 100%; height: 280px; display: block; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1>【相場流】新8銘柄 監視モニター</h1>
      <div class="status-text">基準: スコア60点以上 | 同時保有最大2枠 | 枠厳守配分</div>
    </div>
    <div id="updateTime" class="status-text">読込中...</div>
  </header>

  <div class="card">
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>コード</th>
            <th>銘柄名</th>
            <th style="text-align: right;">株価</th>
            <th style="text-align: center;">スコア</th>
            <th style="text-align: center;">現物シグナル</th>
            <th style="text-align: center;">信用シグナル</th>
            <th style="text-align: right;">目標株数</th>
          </tr>
        </thead>
        <tbody id="stockTableBody"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <div class="chart-header">
      <div id="selectedStockInfo" class="chart-title">銘柄を選択してください</div>
      <div class="legend">
        <div class="legend-item"><div class="dot-ma5"></div> 5MA (赤)</div>
        <div class="legend-item"><div class="dot-ma20"></div> 20MA (青)</div>
      </div>
    </div>
    <canvas id="chartCanvas"></canvas>
  </div>
</div>

<script>
  let dataset = null;
  let selectedCode = "8306.T";

  function drawChart(bars) {
    const canvas = document.getElementById("chartCanvas");
    const ctx = canvas.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);

    const width = rect.width, height = rect.height;
    ctx.clearRect(0, 0, width, height);

    const count = bars.length;
    let minP = Infinity, maxP = -Infinity;
    bars.forEach(b => {
      if (b.low < minP) minP = b.low;
      if (b.high > maxP) maxP = b.high;
      if (b.ma20 && b.ma20 < minP) minP = b.ma20;
      if (b.ma20 && b.ma20 > maxP) maxP = b.ma20;
    });

    const padY = (maxP - minP) * 0.08;
    minP -= padY; maxP += padY;
    const pRange = maxP - minP;

    const chartLeft = 48;
    const chartWidth = width - chartLeft;
    const getY = (p) => height - 24 - ((p - minP) / pRange) * (height - 36);
    const stepX = chartWidth / count;

    ctx.font = "10px sans-serif";
    ctx.fillStyle = "#8e8e93";
    for (let g = 0; g <= 3; g++) {
      const p = minP + (pRange / 3) * g;
      const y = getY(p);
      ctx.strokeStyle = "rgba(255, 255, 255, 0.08)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(chartLeft, y);
      ctx.lineTo(width, y);
      ctx.stroke();
      ctx.fillText(Math.round(p).toLocaleString(), 4, y + 3);
    }

    bars.forEach((b, idx) => {
      const x = chartLeft + idx * stepX + stepX / 2;
      const isYang = b.close >= b.open;
      const color = isYang ? "#ff453a" : "#0a84ff";

      ctx.strokeStyle = color;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(x, getY(b.high));
      ctx.lineTo(x, getY(b.low));
      ctx.stroke();

      const top = getY(Math.max(b.open, b.close));
      const bot = getY(Math.min(b.open, b.close));
      ctx.fillStyle = color;
      ctx.fillRect(x - stepX * 0.35, top, Math.max(stepX * 0.7, 1.5), Math.max(bot - top, 2));
    });

    // 20MA
    ctx.strokeStyle = "#0a84ff";
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    let s20 = false;
    bars.forEach((b, idx) => {
      if (b.ma20) {
        const x = chartLeft + idx * stepX + stepX / 2;
        const y = getY(b.ma20);
        if (!s20) { ctx.moveTo(x, y); s20 = true; } else ctx.lineTo(x, y);
      }
    });
    ctx.stroke();

    // 5MA
    ctx.strokeStyle = "#ff3b30";
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    let s5 = false;
    bars.forEach((b, idx) => {
      if (b.ma5) {
        const x = chartLeft + idx * stepX + stepX / 2;
        const y = getY(b.ma5);
        if (!s5) { ctx.moveTo(x, y); s5 = true; } else ctx.lineTo(x, y);
      }
    });
    ctx.stroke();

    for (let dIdx = 2; dIdx < count; dIdx += 7) {
      if (bars[dIdx]) {
        const x = chartLeft + dIdx * stepX - 10;
        ctx.fillText(bars[dIdx].date, x, height - 6);
      }
    }
  }

  function renderTable() {
    const tbody = document.getElementById("stockTableBody");
    tbody.innerHTML = "";
    if (!dataset) return;

    for (const [code, item] of Object.entries(dataset.stocks)) {
      const tr = document.createElement("tr");
      tr.className = `clickable-row ${code === selectedCode ? "selected-row" : ""}`;
      tr.onclick = () => {
        selectedCode = code;
        renderTable();
        updateChart();
      };

      const pStr = Math.floor(item.price).toLocaleString() + " 円";
      let scoreHtml = `<span class="score-none">--</span>`;
      if (item.score >= 70) scoreHtml = `<span class="score-high">${item.score}点</span>`;
      else if (item.score >= 50) scoreHtml = `<span class="score-mid">${item.score}点</span>`;

      const genHtml = item.signal === "BUY" ? `<span class="badge badge-buy">現買</span>` : `<span class="badge badge-wait">待機</span>`;
      const shinHtml = item.signal === "SHORT" ? `<span class="badge badge-short">空売</span>` : `<span class="badge badge-wait">待機</span>`;

      tr.innerHTML = `
        <td style="font-weight: 600;">${item.num}</td>
        <td style="font-weight: 600; color: ${code === selectedCode ? 'var(--accent-yellow)' : 'var(--text-main)'};">${item.name}</td>
        <td style="text-align: right; font-weight: 700;">${pStr}</td>
        <td style="text-align: center;">${scoreHtml}</td>
        <td style="text-align: center;">${genHtml}</td>
        <td style="text-align: center;">${shinHtml}</td>
        <td style="text-align: right; color: var(--text-sub);">${item.target}株</td>
      `;
      tbody.appendChild(tr);
    }
  }

  function updateChart() {
    if (!dataset || !dataset.stocks[selectedCode]) return;
    const item = dataset.stocks[selectedCode];
    document.getElementById("selectedStockInfo").textContent = `${item.name} (${item.num}) - 最新: ${Math.floor(item.price).toLocaleString()}円`;
    drawChart(item.bars);
  }

  async function init() {
    try {
      // 同一リポジトリ内の静的JSONをフェッチ (CORS制約なし)
      const res = await fetch(`stock_data.json?_=${Date.now()}`);
      if (!res.ok) throw new Error("JSON読み込み失敗");
      dataset = await res.json();
      document.getElementById("updateTime").textContent = `更新: ${dataset.updated_at}`;
      renderTable();
      updateChart();
    } catch (e) {
      document.getElementById("updateTime").textContent = "データ未生成 (初回実行待ち)";
    }
  }

  window.addEventListener("resize", () => { if (dataset) updateChart(); });
  init();
</script>

</body>
</html>
