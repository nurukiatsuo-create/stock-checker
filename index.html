<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="相場流ボード">
  <title>【相場流】シグナル判定ダッシュボード</title>

  <style>
    :root {
      --bg: #0e0e10;
      --card-bg: #18181b;
      --border: #27272a;
      --text: #f4f4f5;
      --text-sub: #a1a1aa;
      --accent: #ffd60a;
      --up-red: #ff453a;
      --down-blue: #0a84ff;
      --hold-green: #30d158;
      --wait-orange: #ff9f0a;
      --profit-purple: #bf5af2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    header {
      height: 48px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background-color: var(--card-bg);
      flex-shrink: 0;
    }

    .title-group {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    h1 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .status-tag {
      font-size: 11px;
      color: var(--accent);
      background: rgba(255, 214, 10, 0.12);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    .meta-group {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: var(--text-sub);
    }

    .btn-refresh {
      background: #27272a;
      border: none;
      color: var(--text);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }

    main {
      flex: 1;
      display: flex;
      overflow: hidden;
      padding: 12px 16px;
      gap: 14px;
    }

    /* 左側チャート */
    .chart-panel {
      flex: 1.45;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chart-header {
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.02);
      flex-shrink: 0;
    }

    .chart-title {
      font-size: 14.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chart-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      background: #141416;
      overflow: hidden;
    }

    .chart-body img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 6px;
    }

    /* 右側リスト */
    .list-panel {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .list-header-title {
      padding: 10px 16px;
      font-size: 13.5px;
      font-weight: 700;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.02);
      flex-shrink: 0;
    }

    .table-container {
      flex: 1;
      overflow-y: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      font-size: 11.5px;
      color: var(--text-sub);
      font-weight: 600;
      padding: 10px 8px;
      background: #18181b;
      position: sticky;
      top: 0;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    td {
      padding: 10px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 13px;
      vertical-align: middle;
      cursor: pointer;
      white-space: nowrap;
    }

    tr:hover, tr.active {
      background: rgba(255, 214, 10, 0.1);
    }

    tr.active td.col-name {
      color: var(--accent);
      font-weight: 700;
    }

    .col-price-box {
      text-align: right;
      padding-right: 8px;
    }

    .col-price {
      font-family: "DIN Alternate", "SF Mono", monospace;
      font-size: 14.5px;
      font-weight: 700;
    }

    .col-pnl {
      font-family: "DIN Alternate", "SF Mono", monospace;
      font-size: 11px;
      font-weight: 600;
      margin-top: 2px;
    }

    .badge {
      display: inline-block;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 10.5px;
      font-weight: 700;
      text-align: center;
      min-width: 44px;
      color: #fff;
    }

    .badge-hold  { background-color: var(--hold-green); }
    .badge-buy   { background-color: var(--up-red); }
    .badge-wait  { background-color: var(--wait-orange); }
    .badge-exit  { background-color: var(--profit-purple); }
    .badge-short { background-color: var(--down-blue); }
    .badge-none  { background-color: #27272a; color: #a1a1aa; }

    .pnl-plus { color: var(--up-red); }
    .pnl-minus { color: var(--down-blue); }
    .pnl-badge {
      font-size: 12px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      margin-left: 6px;
    }

    @media (max-height: 500px) and (orientation: landscape) {
      header { height: 36px; padding: 0 12px; }
      h1 { font-size: 14px; }
      .status-tag { display: none; }
      main { padding: 6px 10px; gap: 8px; }
      .chart-header { padding: 6px 10px; }
      td { padding: 6px 8px; font-size: 12px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="title-group">
      <h1>【相場流】シグナル判定</h1>
      <span class="status-tag">iPad 全画面ダッシュボード</span>
    </div>
    <div class="meta-group">
      <span id="updated-at">読み込み中...</span>
      <button class="btn-refresh" onclick="fetchData()">🔄 更新</button>
    </div>
  </header>

  <main>
    <!-- 左：チャート領域 -->
    <section class="chart-panel">
      <div class="chart-header">
        <div class="chart-title" id="current-chart-name">三菱UFJ (8306)</div>
        <div id="current-chart-badges" style="display: flex; gap: 6px;"></div>
      </div>
      <div class="chart-body">
        <img id="chart-img" src="" alt="株価チャート">
      </div>
    </section>

    <!-- 右：銘柄一覧テーブル -->
    <section class="list-panel">
      <div class="list-header-title">監視ポートフォリオ（タップで切替）</div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th style="width: 40%;">銘柄</th>
              <th style="width: 28%; text-align: right; padding-right: 8px;">株価 / 損益</th>
              <th style="width: 16%; text-align: center;">現物</th>
              <th style="width: 16%; text-align: center;">信用</th>
            </tr>
          </thead>
          <tbody id="stock-table-body">
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    let currentData = null;
    let selectedCode = "8306";

    async function fetchData() {
      try {
        const res = await fetch(`result.json?t=${Date.now()}`);
        currentData = await res.json();
        render();
      } catch (err) {
        console.error("データ取得失敗:", err);
      }
    }

    function render() {
      if (!currentData) return;

      document.getElementById("updated-at").innerText = currentData.updated_at;

      const tbody = document.getElementById("stock-table-body");
      tbody.innerHTML = "";

      currentData.stocks.forEach(stock => {
        const tr = document.createElement("tr");
        if (stock.code === selectedCode) tr.classList.add("active");

        const spotBadge = getSpotBadge(stock);
        const marginBadge = getMarginBadge(stock);

        let pnlText = "";
        if (stock.is_holding && stock.pnl_per_share !== null && stock.pnl_per_share !== undefined) {
          const sign = stock.pnl_per_share >= 0 ? "+" : "";
          const pnlClass = stock.pnl_per_share >= 0 ? "pnl-plus" : "pnl-minus";
          pnlText = `<div class="col-pnl ${pnlClass}">${sign}${stock.pnl_per_share}円 (${sign}${stock.pnl_rate}%)</div>`;
        }

        tr.innerHTML = `
          <td class="col-name">${stock.code === selectedCode ? '▶ ' : ''}${stock.name} <span style="font-size:11px; color:#71717a;">${stock.code}</span></td>
          <td class="col-price-box">
            <div class="col-price">${stock.price.replace("円", "")}</div>
            ${pnlText}
          </td>
          <td style="text-align: center;">${spotBadge}</td>
          <td style="text-align: center;">${marginBadge}</td>
        `;

        tr.onclick = () => selectStock(stock.code);
        tbody.appendChild(tr);
      });

      updateChartArea();
    }

    function selectStock(code) {
      selectedCode = code;
      render();
    }

    function updateChartArea() {
      const stock = currentData.stocks.find(s => s.code === selectedCode) || currentData.stocks[0];
      
      let headerHTML = `<span style="color:#f4f4f5;">${stock.name} (${stock.code})</span>`;

      if (stock.is_holding && stock.entry_price) {
        const isBuy = stock.pos_type === "buy";
        const typeLabel = isBuy ? "【買】" : "【空売】";
        const typeColor = isBuy ? "#ffd60a" : "#0a84ff";
        
        headerHTML += ` <span style="color:${typeColor}; margin-left:6px; font-weight:bold;">${typeLabel}${Math.round(stock.entry_price).toLocaleString()}円</span>`;

        if (stock.pnl_per_share !== null && stock.pnl_per_share !== undefined) {
          const sign = stock.pnl_per_share >= 0 ? "+" : "";
          const pnlColor = stock.pnl_per_share >= 0 ? "var(--up-red)" : "var(--down-blue)";
          headerHTML += ` <span class="pnl-badge" style="color:${pnlColor};">損益: ${sign}${stock.pnl_per_share}円 (${sign}${stock.pnl_rate}%)</span>`;
        }
      }

      document.getElementById("current-chart-name").innerHTML = headerHTML;

      const badgeArea = document.getElementById("current-chart-badges");
      badgeArea.innerHTML = getSpotBadge(stock) + getMarginBadge(stock);

      const chartImg = document.getElementById("chart-img");
      chartImg.onerror = function() {
        this.onerror = null;
        this.src = `chart.png?t=${Date.now()}`;
      };
      chartImg.src = `chart_${selectedCode}.png?t=${Date.now()}`;
    }

    // ★ 現物バッジ判定（「逆下半身」を除外して判定）
    function getSpotBadge(item) {
      const status = item.status || "";
      if (item.pos_type === "buy") {
        if (status.includes("警戒")) return `<span class="badge badge-wait">高値警戒</span>`;
        if (status.includes("手仕舞")) return `<span class="badge badge-exit">手仕舞</span>`;
        return `<span class="badge badge-hold">保有中</span>`;
      }
      // 「逆下半身」の誤爆を防止
      if (status.includes("下半身") && !status.includes("逆下半身")) {
        return `<span class="badge badge-buy">現買</span>`;
      }
      if (status.includes("反発待") || status.includes("押し目")) return `<span class="badge badge-wait">反発待</span>`;
      return `<span class="badge badge-none">待機</span>`;
    }

    // ★ 信用（空売り）バッジ判定
    function getMarginBadge(item) {
      const status = item.status || "";
      if (item.pos_type === "sell") {
        if (status.includes("警戒")) return `<span class="badge badge-wait">底値警戒</span>`;
        if (status.includes("返済買")) return `<span class="badge badge-exit">返済買</span>`;
        return `<span class="badge badge-short">空売中</span>`;
      }
      if (status.includes("逆下半身") || status.includes("空売")) return `<span class="badge badge-short">空売</span>`;
      return `<span class="badge badge-none">待機</span>`;
    }

    fetchData();
    setInterval(fetchData, 60000);
  </script>
</body>
</html>
