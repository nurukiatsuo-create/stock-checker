<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>【相場流】新8銘柄モニター</title>
  <style>
    :root {
      --bg: #121214; --card: #1c1c1e; --border: #2c2c2e;
      --text: #f2f2f7; --sub: #8e8e93; --yellow: #ffd60a;
      --red: #ff453a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, sans-serif;
      padding: 16px; display: flex; justify-content: center;
    }
    .container { width: 100%; max-width: 540px; display: flex; flex-direction: column; gap: 14px; }
    header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    h1 { font-size: 1.15rem; font-weight: 700; }
    .status { font-size: 0.8rem; color: var(--sub); }
    .card { background: var(--card); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    th { color: var(--sub); padding: 10px 8px; border-bottom: 1px solid var(--border); text-align: left; font-size: 0.8rem; }
    td { padding: 12px 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    tr.row { cursor: pointer; }
    tr.row:active { background: rgba(255,255,255,0.08); }
    tr.selected { background: rgba(255, 214, 10, 0.12); }
    .badge { padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; display: inline-block; }
    .b-wait { background: #2c2c2e; color: #8e8e93; }
    .b-buy { background: var(--red); color: #fff; }
    .chart-container { padding: 12px; text-align: center; }
    .chart-header { display: flex; justify-content: space-between; font-size: 0.95rem; font-weight: bold; margin-bottom: 8px; color: var(--yellow); }
    #chartImg { width: 100%; height: auto; border-radius: 8px; display: block; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>【相場流】新8銘柄モニター</h1>
    <div id="utime" class="status">読込中...</div>
  </header>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>銘柄</th>
          <th style="text-align:right;">株価</th>
          <th style="text-align:center;">点数</th>
          <th style="text-align:center;">現買判定</th>
          <th style="text-align:right;">目標</th>
        </tr>
      </thead>
      <tbody id="list"></tbody>
    </table>
  </div>

  <div class="card chart-container">
    <div class="chart-header">
      <span id="chartTitle">銘柄を選択してください</span>
      <span style="font-size:0.75rem; color:var(--sub); font-weight:normal;">赤:5MA / 青:20MA</span>
    </div>
    <img id="chartImg" alt="チャート画像" src="" style="display:none;" />
  </div>
</div>

<script>
  let dataset = null;
  let currentCode = "8306.T";

  function selectStock(code) {
    currentCode = code;
    const item = dataset.stocks[code];
    if (!item) return;

    document.querySelectorAll("tr.row").forEach(tr => {
      tr.classList.toggle("selected", tr.dataset.code === code);
    });

    document.getElementById("chartTitle").textContent = `${item.name} (${item.num}) - ${item.price.toLocaleString()}円`;
    const imgEl = document.getElementById("chartImg");
    imgEl.src = item.chart_png;
    imgEl.style.display = "block";
  }

  function render() {
    const tbody = document.getElementById("list");
    tbody.innerHTML = "";

    for (const [code, item] of Object.entries(dataset.stocks)) {
      const tr = document.createElement("tr");
      tr.className = `row ${code === currentCode ? "selected" : ""}`;
      tr.dataset.code = code;
      tr.onclick = () => selectStock(code);

      const pStr = item.price.toLocaleString() + "円";
      const scColor = item.score.includes("点") ? "#ff453a" : "#8e8e93";
      const bClass = item.signal === "現買" ? "b-buy" : "b-wait";

      tr.innerHTML = `
        <td style="font-weight:bold;">${item.name}</td>
        <td style="text-align:right; font-weight:bold;">${pStr}</td>
        <td style="text-align:center; color:${scColor}; font-weight:bold;">${item.score}</td>
        <td style="text-align:center;"><span class="badge ${bClass}">${item.signal}</span></td>
        <td style="text-align:right; color:var(--sub);">${item.target}株</td>
      `;
      tbody.appendChild(tr);
    }

    selectStock(currentCode);
  }

  async function init() {
    try {
      const res = await fetch(`stock_data.json?_=${Date.now()}`);
      if (!res.ok) throw new Error();
      dataset = await res.json();
      document.getElementById("utime").textContent = `更新: ${dataset.updated_at}`;
      render();
    } catch(e) {
      document.getElementById("utime").textContent = "データ未生成 (Actions初回実行待ち)";
      document.getElementById("list").innerHTML = `<tr><td colspan="5" style="text-align:center; padding:20px; color:var(--sub);">Actionsタブから「Run workflow」を実行してください</td></tr>`;
    }
  }

  init();
</script>

</body>
</html>
